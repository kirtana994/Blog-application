{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}My Blog{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >
    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="{% static 'blog/styles.css' %}">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand" href="{% url 'home' %}">
                My Blog
            </a>

            <!-- Mobile menu button -->
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navbar links -->
            <div class="collapse navbar-collapse" id="navbarNav">

                <form class="d-flex me-3" method="GET" action="{% url 'home' %}">
                    <input
                        class="form-control me-2"
                        type="search"
                        name="q"
                        placeholder="Search posts..."
                        value="{{ request.GET.q }}"
                    >

                    <button
                        class="btn btn-outline-light"
                        type="submit"
                    >
                        Search
                    </button>
                </form>
            </div>
            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'home' %}">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'post_create' %}">
                        Create Post
                    </a>
                </li>

                {% if user.is_authenticated %}

                    <li class="nav-item">
                        <span class="nav-link">
                            Hello, {{ user.username }}
                        </span>
                    </li>

                    <li class="nav-item">
                        <form method="POST" action="{% url 'logout' %}" class="d-inline">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-link nav-link">
                                Logout
                            </button>
                        </form>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'my_posts' %}">
                            My Posts
                        </a>
                    </li>

                {% else %}

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'login' %}">
                            Login
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'signup' %}">
                            Signup
                        </a>
                    </li>

                {% endif %}

            </ul>
            </div>

        </div>
    </nav>


    <!-- Main Content -->
    <main class="container mt-4">

        {% block content %}
        {% endblock %}

    </main>


    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
